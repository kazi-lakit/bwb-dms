<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Store, organize, and share your files." />
    <title>Vault — Document Management</title>
    <script>
      try {
        const stored = localStorage.getItem("theme");
        document.documentElement.dataset.theme = stored === "dark" || stored === "light"
          ? stored
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (_) {}
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-canvas text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
